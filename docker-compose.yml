services:
  braun-tn:
    build:
     context: .
     dockerfile: Dockerfile
    container_name: braun-tn1
    restart: unless-stopped
    ports:
      - "8082:80"  # Changed to avoid conflict
    volumes:
      - ./:/var/www/html:delegated
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - storage_data:/var/www/html/storage
      - cache_data:/var/www/html/bootstrap/cache
      - sessions_data:/var/www/html/storage/framework/sessions
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: braun
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      KONNECT_API_KEY: 64df5427b7cb96a7051c2262:geb4oKBQdaPv3EmPWV
      KONNECT_WALLET_ID: 64df5427b7cb96a7051c2265
      SESSION_DRIVER: file
      SESSION_LIFETIME: 120
      SESSION_DOMAIN: null
      SESSION_SECURE_COOKIE: false
      SANCTUM_STATEFUL_DOMAINS: localhost:8082,127.0.0.1:8082
    networks:
      - braun-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: mysql:8.0
    container_name: braun-tn-db1
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-host-cache
    environment:
      MYSQL_DATABASE: braun
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./mysql-init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - braun-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: braun-tn-phpmyadmin1
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - braun-network

networks:
  braun-network:
    driver: bridge

volumes:
  dbdata:
  storage_data:
  cache_data:
  sessions_data: